<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1033">
<title>יוסי והצ'ולנט האבוד</title>
<meta name="description" content="משחק פלטפורמה מצחיק בסגנון סופר מריו. יוסי רץ, קופץ ורודף אחרי סיר צ'ולנט שברח לפני שבת.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#120a24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Rubik',Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto;background:#120a24;box-shadow:0 0 60px rgba(0,0,0,.6)}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);touch-action:none}
  .tb.down{background:rgba(255,210,60,.55)}
  #bl{left:calc(14px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}
  #br{left:calc(122px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}
  #bj{right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:108px;height:108px;background:rgba(80,200,120,.35)}
  #bn{right:calc(138px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));background:rgba(70,140,255,.3)}
  #bt{right:calc(24px + env(safe-area-inset-right));bottom:calc(140px + env(safe-area-inset-bottom));width:76px;height:76px;font-size:18px;background:rgba(255,140,60,.35)}
  #bm{right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:54px;height:54px;font-size:22px}
  #rot{position:fixed;inset:0;background:#120a24;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:800;padding:30px;z-index:9}
  @media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="tb" id="bl" data-k="left">◀</div>
  <div class="tb" id="br" data-k="right">▶</div>
  <div class="tb" id="bn" data-k="run">רוץ</div>
  <div class="tb" id="bj" data-k="jump">קפוץ</div>
  <div class="tb" id="bt" data-k="throw">חלה</div>
  <div class="tb" id="bm" data-k="mute">🔊</div>
</div>
<div id="rot">סובבו את הטלפון לרוחב<br>כדי לרוץ עם יוסי</div>
<script src="js/core.js"></script>
<script src="js/rig.js"></script>
<script src="js/logic.js"></script>
<script src="js/render.js"></script>
</body>
</html>
